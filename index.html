<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Core Primary SEO -->
    <title>ProductPilot — Discover Better Products. Buy Smarter.</title>
    <meta name="description" content="ProductPilot is a premier product discovery, in-depth editorial reviews, buying guides, and smart comparison platform connecting shoppers with top-tier gear across Amazon, eBay, AliExpress, and Daraz." />
    <meta name="keywords" content="product reviews, buying guides, electronics testing, headphone benchmarks, price comparison, lab tested gear, best tech 2026" />
    <meta name="author" content="ProductPilot Editorial Board" />
    
    <!-- Google Discover & Crawler Directives -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    
    <!-- Canonical & Alternate Hreflang -->
    <link rel="canonical" href="https://productpilot.com/" />
    <link rel="alternate" hreflang="x-default" href="https://productpilot.com/" />
    <link rel="alternate" hreflang="en" href="https://productpilot.com/" />
    
    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProductPilot" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://productpilot.com/" />
    <meta property="og:title" content="ProductPilot — Discover Better Products. Buy Smarter." />
    <meta property="og:description" content="Discover lab-tested products, independent reviews, and multi-merchant prices across Amazon, eBay, AliExpress, and Daraz." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=1200&h=630&auto=format&fit=crop&q=80" />
    <meta property="og:image:secure_url" content="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=1200&h=630&auto=format&fit=crop&q=80" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ProductPilot — Independent Hardware Reviews and Smart Buying Guides" />
    
    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ProductPilotLab" />
    <meta name="twitter:creator" content="@ProductPilotLab" />
    <meta name="twitter:title" content="ProductPilot — Discover Better Products. Buy Smarter." />
    <meta name="twitter:description" content="Discover lab-tested products, independent reviews, and multi-merchant prices." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=1200&h=630&auto=format&fit=crop&q=80" />
    
    <!-- Mobile Web App & Theme -->
    <meta name="theme-color" content="#1D4ED8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ProductPilot" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='12' fill='%231D4ED8'/><circle cx='24' cy='24' r='15.5' stroke='white' stroke-opacity='0.3' stroke-width='1.5' stroke-dasharray='2 2'/><polygon points='24,11 37,24 25.5,23.5 24,24' fill='%2360A5FA'/><polygon points='37,24 24,37 24.5,25 24,24' fill='%231E40AF'/><polygon points='24,11 25.5,23.5 13,24' fill='%2393C5FD'/><polygon points='13,24 24.5,25 24,37' fill='%233B82F6'/><circle cx='24' cy='24' r='3' fill='white'/><circle cx='37' cy='11' r='2' fill='%23FBBF24'/></svg>" />
    
    <!-- Performance: DNS Prefetch & Preconnect Critical Third-Party Domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://m.media-amazon.com" />
    <link rel="dns-prefetch" href="https://i.ebayimg.com" />
    <link rel="dns-prefetch" href="https://ae01.alicdn.com" />
    <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />
    
    <!-- Typography with font-display: swap for 0 layout shift -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
